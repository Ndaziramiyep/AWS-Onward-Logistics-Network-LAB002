AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Onward Logistics order system network. Two Availability Zones, an internet-facing
  Application Load Balancer with self-healing front-end servers, private internal servers
  that can only make outbound connections through NAT, and SSM Session Manager for admin
  access (no SSH, no key pairs, no inline IAM policies).

# ---------------------------------------------------------------------------
# PARAMETERS: change values in infrastructure/deployment.yaml, not in this file.
# Owner, CostCenter and other tags are set as stack tags in deployment.yaml and
# propagate to every taggable resource.
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Naming" }
        Parameters: [ProjectName, Environment]
      - Label: { default: "Front-end page content" }
        Parameters: [StudentName, LabName]
      - Label: { default: "Network addressing" }
        Parameters:
          [
            VpcCidr,
            PublicSubnet1Cidr,
            PublicSubnet2Cidr,
            PrivateSubnet1Cidr,
            PrivateSubnet2Cidr,
          ]
      - Label: { default: "Compute" }
        Parameters:
          [InstanceType, LatestAmiId, FrontEndMinSize, FrontEndMaxSize]

Parameters:
  ProjectName:
    Type: String
    Default: onward-logistics
    AllowedPattern: "^[a-z0-9-]{3,30}$"
    Description: Lower-case prefix used in every resource name.
  Environment:
    Type: String
    Default: lab
    AllowedValues: [lab, dev, test, prod]
  StudentName:
    Type: String
    Default: Patrick Ndaziramiye
    AllowedPattern: "^[A-Za-z .'-]{2,60}$"
    Description: Full name shown on the front-end page.
  LabName:
    Type: String
    Default: Highly Available, Secure Network on AWS
    AllowedPattern: "^[A-Za-z0-9 ,.&'-]{2,80}$"
    Description: Lab name shown on the front-end page.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro]
    Description: Free Tier eligible type (t2.micro in older accounts or regions, t3.micro in newer ones).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved by CloudFormation at deploy time.
  FrontEndMinSize:
    Type: Number
    Default: 2
    MinValue: 2
    Description: Keep at least 2 so there is always one server per Availability Zone.
  FrontEndMaxSize:
    Type: Number
    Default: 4
    MinValue: 2

# ---------------------------------------------------------------------------
# RESOURCES
# ---------------------------------------------------------------------------
Resources:
  # ===== 1. NETWORK: VPC, subnets, gateways, routes =====
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-igw" }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-public-1" }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-public-2" }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-private-1" }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-private-2" }

  # Public route table: default route to the Internet Gateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # One NAT Gateway per AZ so losing one zone never cuts updates in the other
  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-nat-eip-1" }

  NatEip2:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-nat-eip-2" }

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-nat-1" }

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-nat-2" }

  # Private route tables: outbound only, through the NAT in the same AZ.
  # There is NO route to the Internet Gateway, so nothing can start a connection inward.
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {
            Key: Name,
            Value: !Sub "${ProjectName}-${Environment}-private-rt-1",
          }

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {
            Key: Name,
            Value: !Sub "${ProjectName}-${Environment}-private-rt-2",
          }

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # ===== 2. SECURITY GROUPS (no port 22 anywhere) =====
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-alb-sg"
      GroupDescription: Load balancer. HTTP from the internet.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 80,
            ToPort: 80,
            CidrIp: 0.0.0.0/0,
            Description: HTTP from the internet,
          }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-alb-sg" }

  FrontEndSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-frontend-sg"
      GroupDescription: Front-end servers. HTTP only from the load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 80,
            ToPort: 80,
            SourceSecurityGroupId: !Ref AlbSecurityGroup,
            Description: HTTP from the load balancer only,
          }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-frontend-sg" }

  InternalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-internal-sg"
      GroupDescription: Internal order services. No internet inbound. Only the front end may call port 8080.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 8080,
            ToPort: 8080,
            SourceSecurityGroupId: !Ref FrontEndSecurityGroup,
            Description: Order service calls from the front end,
          }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-internal-sg" }

  # ===== 3. IAM: role for Session Manager (managed policy only, no inline policies) =====
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ec2-ssm-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags:
        - {
            Key: Name,
            Value: !Sub "${ProjectName}-${Environment}-ec2-ssm-role",
          }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-ec2-ssm-profile"
      Roles: [!Ref InstanceRole]

  # ===== 4. FRONT END: Load balancer + Auto Scaling group =====
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-alb" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-tg"
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-tg" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  FrontEndLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${Environment}-frontend-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref FrontEndSecurityGroup]
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {
                  Key: Name,
                  Value: !Sub "${ProjectName}-${Environment}-frontend",
                }
          - ResourceType: volume
            Tags:
              - {
                  Key: Name,
                  Value: !Sub "${ProjectName}-${Environment}-frontend-vol",
                }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            dnf install -y httpd
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
            AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)
            IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html lang="en">
            <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Onward Logistics Order System</title>
            <style>
            :root{--navy:#0b1f3a;--navy2:#12335c;--blue:#2f80ed;--teal:#19c3a6;--ink:#17212f;--muted:#5b6b80;--bg:#f4f7fb;--card:#fff;--line:#e2e8f0}
            *{box-sizing:border-box;margin:0;padding:0}
            html{scroll-behavior:smooth}
            body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh;width:100%}
            a{color:inherit;text-decoration:none}
            .wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
            header{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(11,31,58,.92);backdrop-filter:blur(8px)}
            .bar{display:flex;align-items:center;justify-content:space-between;height:68px}
            .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:1.1rem}
            .brand svg{width:30px;height:30px}
            nav ul{display:flex;gap:28px;list-style:none}
            nav a{color:#cfe0f7;font-weight:500;font-size:.95rem}
            nav a:hover{color:#fff}
            .burger{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
            .hero{min-height:100vh;display:flex;align-items:center;padding:110px 0 60px;color:#fff;background:radial-gradient(1000px 500px at 85% 10%,rgba(47,128,237,.35),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(25,195,166,.25),transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2))}
            .hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
            .tag{display:inline-block;padding:6px 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:.85rem;color:#bfe9e1;margin-bottom:18px}
            h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.12;margin-bottom:18px}
            h1 span{color:var(--teal)}
            .lead{font-size:clamp(1rem,1.6vw,1.2rem);color:#cfe0f7;max-width:560px;margin-bottom:28px}
            .btns{display:flex;flex-wrap:wrap;gap:14px}
            .btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:600;border:0;cursor:pointer;font-size:1rem}
            .btn-main{background:var(--teal);color:#06261f}
            .btn-main:hover{background:#2fe0c0}
            .btn-ghost{border:1px solid rgba(255,255,255,.45);color:#fff}
            .btn-ghost:hover{background:rgba(255,255,255,.1)}
            .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
            .stat b{display:block;font-size:clamp(1.4rem,2.6vw,2rem);color:#fff}
            .stat small{color:#9db7d9}
            .server{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:26px;backdrop-filter:blur(6px)}
            .server h3{font-size:1rem;color:#bfe9e1;margin-bottom:14px;display:flex;align-items:center;gap:8px}
            .dot{width:10px;height:10px;border-radius:50%;background:#37e6a0;box-shadow:0 0 0 0 rgba(55,230,160,.7);animation:pulse 2s infinite}
            @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(55,230,160,0)}100%{box-shadow:0 0 0 0 rgba(55,230,160,0)}}
            .row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:.95rem}
            .row:last-child{border-bottom:0}
            .row span{color:#9db7d9}
            .row b{text-align:right;word-break:break-word}
            section{padding:clamp(56px,8vw,96px) 0}
            .title{text-align:center;max-width:640px;margin:0 auto 44px}
            .title h2{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-bottom:10px}
            .title p{color:var(--muted)}
            .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
            .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;transition:transform .2s,box-shadow .2s}
            .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,31,58,.1)}
            .ico{width:48px;height:48px;border-radius:12px;background:#e8f1ff;display:grid;place-items:center;margin-bottom:16px}
            .ico svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
            .card h3{margin-bottom:6px}
            .card p{color:var(--muted);font-size:.95rem}
            .alt{background:#fff}
            .flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;counter-reset:s}
            .step{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:26px 22px 22px}
            .step:before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:20px;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
            .step h3{margin-bottom:6px}
            .step p{color:var(--muted);font-size:.93rem}
            .track{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 10px 30px rgba(11,31,58,.06)}
            .tform{display:flex;gap:12px;flex-wrap:wrap}
            .tform input{flex:1 1 220px;padding:13px 14px;font-size:1rem;border:1px solid #cbd5e1;border-radius:10px}
            .tform input:focus{outline:2px solid var(--blue);border-color:transparent}
            .tform .btn{background:var(--blue);color:#fff}
            .prog{list-style:none;margin-top:26px;display:none}
            .prog li{position:relative;padding:0 0 22px 34px;color:var(--muted)}
            .prog li:before{content:"";position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;background:#cbd5e1}
            .prog li:after{content:"";position:absolute;left:7px;top:22px;width:2px;height:calc(100% - 18px);background:#e2e8f0}
            .prog li:last-child:after{display:none}
            .prog li.on{color:var(--ink);font-weight:600}
            .prog li.on:before{background:var(--teal)}
            .ha{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:14px}
            .node{flex:1 1 170px;max-width:240px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
            .node small{display:block;color:var(--muted)}
            .node.priv{border-color:var(--teal);background:#effcf9}
            .arrow{align-self:center;color:var(--blue);font-size:1.6rem}
            .note{text-align:center;color:var(--muted);margin-top:26px;font-size:.95rem}
            footer{background:var(--navy);color:#9db7d9;padding:34px 0;font-size:.92rem}
            .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
            footer b{color:#fff}
            @media(max-width:900px){
            .hero-grid{grid-template-columns:1fr}
            .stats{grid-template-columns:repeat(2,1fr)}
            .burger{display:block}
            nav{position:absolute;top:68px;left:0;right:0;background:var(--navy);display:none}
            nav.open{display:block}
            nav ul{flex-direction:column;gap:0;padding:8px clamp(16px,4vw,40px) 18px}
            nav li a{display:block;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}
            .arrow{transform:rotate(90deg);flex-basis:100%;text-align:center}
            }
            @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
            </style>
            </head>
            <body>
            <header>
             <div class="wrap bar">
              <a class="brand" href="#top"><svg viewBox="0 0 32 32" fill="none" stroke="#19c3a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h17v13H3zM20 13h5l4 4v5h-9z"/><circle cx="9" cy="24" r="2.5" fill="#0b1f3a"/><circle cx="24" cy="24" r="2.5" fill="#0b1f3a"/></svg>Onward Logistics</a>
              <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
              <nav id="menu"><ul>
               <li><a href="#services">Services</a></li>
               <li><a href="#how">How it works</a></li>
               <li><a href="#track">Track order</a></li>
               <li><a href="#reliable">Reliability</a></li>
              </ul></nav>
             </div>
            </header>

            <main id="top">
            <div class="hero"><div class="wrap">
             <div class="hero-grid">
              <div>
               <span class="tag">Order system online</span>
               <h1>Deliveries you can trust, <span>even on your busiest day.</span></h1>
               <p class="lead">Merchants and customers place and track orders here at any time. The system runs in two data center zones, so it keeps working even if one of them has a problem.</p>
               <div class="btns"><a class="btn btn-main" href="#track">Track an order</a><a class="btn btn-ghost" href="#services">Our services</a></div>
               <div class="stats">
                <div class="stat"><b>2</b><small>Availability Zones</small></div>
                <div class="stat"><b>24/7</b><small>Always reachable</small></div>
                <div class="stat"><b>3x</b><small>Peak-day ready</small></div>
                <div class="stat"><b>0</b><small>Open admin ports</small></div>
               </div>
              </div>
              <aside class="server">
               <h3><span class="dot"></span>Live from this server</h3>
               <div class="row"><span>Name</span><b>${StudentName}</b></div>
               <div class="row"><span>Lab</span><b>${LabName}</b></div>
               <div class="row"><span>Server</span><b>$IID</b></div>
               <div class="row"><span>Availability Zone</span><b>$AZ</b></div>
              </aside>
             </div>
            </div></div>

            <section id="services"><div class="wrap">
             <div class="title"><h2>Everything you need to ship</h2><p>Simple tools for merchants and customers, backed by order services that stay safely out of reach of the internet.</p></div>
             <div class="cards">
              <div class="card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></div><h3>Fast delivery</h3><p>Same-day and next-day options across the city.</p></div>
              <div class="card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h3>Live tracking</h3><p>Follow every parcel from pickup to doorstep.</p></div>
              <div class="card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div><h3>Merchant tools</h3><p>Manage bulk orders and see your delivery volume.</p></div>
              <div class="card"><div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h3>Secure by design</h3><p>Internal services are never reachable from the internet.</p></div>
             </div>
            </div></section>

            <section id="how" class="alt"><div class="wrap">
             <div class="title"><h2>How an order flows</h2><p>Three steps, all handled automatically.</p></div>
             <div class="flow">
              <div class="step"><h3>You place the order</h3><p>Your request arrives at our load balancer, the single front door for all traffic.</p></div>
              <div class="step"><h3>A healthy server answers</h3><p>The load balancer sends you to a working front-end server in either zone.</p></div>
              <div class="step"><h3>Private services process it</h3><p>Internal order services handle the work in private subnets, away from the internet.</p></div>
             </div>
            </div></section>

            <section id="track"><div class="wrap">
             <div class="title"><h2>Track an order</h2><p>Enter a tracking number to see where your parcel is. This is a demo.</p></div>
             <div class="track">
              <div class="tform"><input id="num" type="text" placeholder="Tracking number, e.g. ON-123456"><button class="btn" id="go">Track</button></div>
              <ul class="prog" id="prog">
               <li class="on">Order received</li>
               <li class="on">Picked up from merchant</li>
               <li class="on">In transit</li>
               <li>Out for delivery</li>
               <li>Delivered</li>
              </ul>
             </div>
            </div></section>

            <section id="reliable" class="alt"><div class="wrap">
             <div class="title"><h2>Built to stay online</h2><p>If a server or a whole zone fails, customers keep ordering.</p></div>
             <div class="ha">
              <div class="node"><b>Internet</b><small>Merchants and customers</small></div>
              <div class="arrow">&rarr;</div>
              <div class="node"><b>Load balancer</b><small>Spans both zones</small></div>
              <div class="arrow">&rarr;</div>
              <div class="node"><b>Front end x2</b><small>One server per zone</small></div>
              <div class="arrow">&rarr;</div>
              <div class="node priv"><b>Order services</b><small>Private, no inbound internet</small></div>
             </div>
             <p class="note">Engineers manage servers through AWS Systems Manager. No SSH ports and no shared keys.</p>
            </div></section>
            </main>

            <footer><div class="wrap foot">
             <div><b>Onward Logistics</b> order system</div>
             <div>Built by ${StudentName} | ${LabName}</div>
             <div>Served from $IID in $AZ</div>
            </div></footer>

            <script>
            document.getElementById('burger').onclick=function(){document.getElementById('menu').classList.toggle('open')};
            var links=document.querySelectorAll('#menu a');
            for(var i=0;i<links.length;i++){links[i].onclick=function(){document.getElementById('menu').classList.remove('open')}}
            document.getElementById('go').onclick=function(){
             var v=document.getElementById('num').value.trim();
             var p=document.getElementById('prog');
             if(!v){alert('Please enter a tracking number');return}
             p.style.display='block';
            }
            </script>
            </body>
            </html>
            EOF
            systemctl enable --now httpd

  FrontEndAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${ProjectName}-${Environment}-frontend-asg"
      MinSize: !Ref FrontEndMinSize
      MaxSize: !Ref FrontEndMaxSize
      DesiredCapacity: !Ref FrontEndMinSize
      VPCZoneIdentifier: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      LaunchTemplate:
        LaunchTemplateId: !Ref FrontEndLaunchTemplate
        Version: !GetAtt FrontEndLaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      Tags:
        - {
            Key: Name,
            Value: !Sub "${ProjectName}-${Environment}-frontend",
            PropagateAtLaunch: true,
          }
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT2M
        WaitOnResourceSignals: false

  # Scale out automatically on busy sales days
  FrontEndScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref FrontEndAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

  # ===== 5. INTERNAL SERVERS: private subnets, one per AZ =====
  InternalLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-${Environment}-internal-lt"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: |
            #!/bin/bash
            # Proves the private server can download a package through the NAT Gateway.
            dnf install -y htop >> /var/log/internal-bootstrap.log 2>&1 \
              && echo "package download OK" >> /var/log/internal-bootstrap.log \
              || echo "package download FAILED" >> /var/log/internal-bootstrap.log

  InternalServer1:
    Type: AWS::EC2::Instance
    DependsOn: PrivateDefaultRoute1
    Properties:
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds: [!Ref InternalSecurityGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref InternalLaunchTemplate
        Version: !GetAtt InternalLaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-internal-1" }

  InternalServer2:
    Type: AWS::EC2::Instance
    DependsOn: PrivateDefaultRoute2
    Properties:
      SubnetId: !Ref PrivateSubnet2
      SecurityGroupIds: [!Ref InternalSecurityGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref InternalLaunchTemplate
        Version: !GetAtt InternalLaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-internal-2" }

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
Outputs:
  FrontEndUrl:
    Description: Open this in a browser to reach the front end.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  VpcId:
    Value: !Ref Vpc
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  InternalSecurityGroupId:
    Value: !Ref InternalSecurityGroup
  InternalServer1Id:
    Value: !Ref InternalServer1
  InternalServer2Id:
    Value: !Ref InternalServer2
  AdminCommandInternal1:
    Description: Remote admin without SSH or keys.
    Value: !Sub "aws ssm start-session --target ${InternalServer1}"
  AdminCommandInternal2:
    Value: !Sub "aws ssm start-session --target ${InternalServer2}"
